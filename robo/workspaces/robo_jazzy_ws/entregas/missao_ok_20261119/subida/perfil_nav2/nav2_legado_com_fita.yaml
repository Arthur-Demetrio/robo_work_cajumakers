        linear_min: 0.005
        linear_max: 0.35
        direction_start_angle: 2.356
        direction_end_angle: -2.356
        theta_min: -0.6
        theta_max: 0.6
      right:
        points: '[[0.425, 0.050], [0.425, -0.375], [-0.225, -0.375], [-0.225, 0.050]]'
