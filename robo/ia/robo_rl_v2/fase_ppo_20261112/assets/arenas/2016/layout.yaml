  - {id: plataforma_centro_leste, kind: platform, shapes: [{rect: [7.60, 3.30, 0.60, 0.65], white: true}]}
variants:
  arena_2016_aproximada: {mobile_boxes: 0, noise: false}
  arena_2016_limpa: {mobile_boxes: 0, noise: false}
  arena_2016_treino:
    mobile_boxes: 3
    box_size_m: [0.25, 0.45]
    noise: true
    sensor_noise_m: 0.015
    physical_noise_std: [0.001, 0.002, 0.001]
    scan_dropout_probability: 0.01
    friction_range: [0.90, 1.0]
    slip_range: [0.02, 0.06]
    odom_bias_std: [0.003, 0.003, 0.002]
    delay_ticks: [1, 2]
    pose_jitter_m: 0.08
# Explicit free internal cavities and central crossing, checked against raster occupancy.
passage_areas:
  - {id: cavidade_noroeste, rect: [2.05, 8.02, 1.90, 0.80]}
  - {id: cavidade_nordeste, rect: [9.95, 8.02, 1.90, 0.80]}
  - {id: cavidade_oeste, rect: [2.34, 5.20, 1.56, 1.10]}
  - {id: cavidade_leste, rect: [9.66, 5.20, 1.56, 1.10]}
  - {id: cruzamento_central, rect: [5.96, 4.75, 1.20, 1.04]}
