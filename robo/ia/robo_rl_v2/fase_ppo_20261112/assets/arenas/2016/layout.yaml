name: arena_2016
attribution: reconstrução aproximada da arena RoboCup@Work 2016 baseada em referência visual e restrições geométricas conhecidas
size_m: [12.0, 10.0]
resolution_m: 0.025
minimum_passage_m: 0.80
boundary_m: 0.10
# Coordinates are metric, origin southwest. Each group is one connected fixture.
# Rect: [center_x, center_y, width, height]; circle: [center_x, center_y, radius].
fixtures:
