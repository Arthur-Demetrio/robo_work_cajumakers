      - {rect: [2.05, 5.84, 2.20, 0.12]}
      - {rect: [1.30, 5.20, 0.46, 1.20], white: true}
  - id: cobertura_leste
    kind: canopy
    shapes:
      - {rect: [10.99, 5.20, 0.12, 1.40]}
      - {rect: [9.95, 4.56, 2.20, 0.12]}
      - {rect: [9.95, 5.84, 2.20, 0.12]}
