  - {id: quina_oeste, kind: wall, shapes: [{rect: [3.35, 3.10, 0.12, 0.80]}, {rect: [3.68, 3.44, 0.78, 0.12]}]}
  - id: estacao_noroeste
    kind: workstation
    shapes:
      - {rect: [2.05, 8.94, 2.20, 0.12]}
      - {rect: [1.01, 8.30, 0.12, 1.40]}
      - {rect: [3.09, 8.30, 0.12, 1.40]}
