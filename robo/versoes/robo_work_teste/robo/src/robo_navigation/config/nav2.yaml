controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    # Tolera falhas curtas do controlador (ex.: colisao falsa por um scan
    # ruim) antes de acionar o BT de recuperacao.
    failure_tolerance: 1.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # O robo passa alguns cm do ponto (velocidade minima 0,14 m/s + atraso
      # para frear). Com 0.05 o destino ficava atras dele e ele girava ~180
      # graus varias vezes na chegada. Antes: 0.05.
      xy_goal_tolerance: 0.10
      # Cada giro no lugar passa ~10 graus do ponto depois do comando de
      # parar (medido em 14/10 com IMU: inercia do robo + atraso). A
      # tolerancia precisa ficar acima disso, senao o robo gira de um lado
      # para o outro sem acertar. 0.10 oscilava; 0.25 (~14) deixava diagonal.
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # A base (sem encoder) so anda entre 0.132 e 0.292 m/s por lado e so gira
      # no lugar a partir de ~0.557 rad/s (ver robo_bridge). Pedir valores
      # abaixo disso faz a bridge arredondar e o robo sai da trajetoria.
      # Velocidade de cruzeiro em reta, perto do maximo da base (0.292).
      # O RPP reduz sozinho em curvas, perto de obstaculos e na chegada
      # (ver regulated_* abaixo), nunca abaixo de 0.14. Antes: 0.18.
      desired_linear_vel: 0.28
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      use_rotate_to_heading: true
      # Giro no lugar um pouco mais rapido (PWM ~190). O excesso de giro
      # sobe para ~13 graus, ainda abaixo do limite de 20. Antes: 0.56.
      rotate_to_heading_angular_vel: 0.65
      # Acima deste erro de direcao o robo para e gira no lugar.
      # - 0.60 (34 graus): pedia curvas que a base nao faz (raio minimo
      #   ~1,2 m andando) e o robo circulava em volta do objetivo.
      # - 0.20 (11 graus): cada giro no lugar passa ~11 graus do ponto
      #   (giro minimo 0,557 rad/s + atraso); o robo oscilava girando para
      #   um lado e para o outro sem avancar.
      # 0.35 (20 graus): o giro para em ~20, termina perto de ~9 graus e o
      # resto e corrigido andando.
      rotate_to_heading_min_angle: 0.35
      # O RPP limita o giro pela velocidade medida: com 1.5 o primeiro ciclo
      # parado pedia so 0.15 rad/s, abaixo do minimo da base (0.557). Com 6.0
      # o primeiro comando ja chega a 0.56 (6.0 x 0.1 s).
      max_angular_accel: 6.0

      # Rapido quando possivel, devagar quando precisa. Todas as reducoes
      # param em 0.14, acima do minimo fisico da base (0.132).
      # - curvas: desacelera abaixo de raio 1.5 m (antes 0.90);
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.14
      # - perto de paredes/passagens estreitas (antes desligado, porque
      #   reduzia abaixo do minimo da base; agora o piso de 0.14 vale aqui);
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      # - chegada: comeca a frear 1 m antes (antes 0.60).
      min_approach_linear_velocity: 0.14
      approach_velocity_scaling_dist: 1.0

      transform_tolerance: 0.30

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      allow_reversing: false


planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      resolution: 0.05
      track_unknown_space: true

      # Medidas reais (58 x 60 cm) em volta do centro de giro, com 1 cm de
      # margem: frente 0.31 (o LiDAR passa 2 cm do chassi) + 0.01, tras
      # 0.29 + 0.01, laterais 0.3015 (rodas) + ~0.01. A margem ja esta aqui,
      # por isso footprint_padding = 0. Antes: quadrado de 0.64 + padding
      # padrao de 0.01 (0.66 x 0.66 m).
      footprint: "[[0.32, 0.31], [0.32, -0.31], [-0.30, -0.31], [-0.30, 0.31]]"
      footprint_padding: 0.0

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      # Conforme robo_lidar/README.md: /scan_front marca obstaculos e
      # /scan_front_clear (+inf nos setores livres) so limpa. Com /scan e sem
      # inf_is_valid, os raios sem retorno nunca limpavam o costmap.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan_mark scan_clear

        scan_mark:
          topic: /scan_front
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.08
          obstacle_max_range: 5.5
          obstacle_min_range: 0.08

        scan_clear:
          topic: /scan_front_clear
          max_obstacle_height: 2.0
          clearing: true
          marking: false
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.08

      # Bolha maior que o raio da quina da footprint (~0.45 m).
      # Nao usar menos que 0.32: o NavFn trata o robo como ponto e passaria
      # a planejar por vaos onde o robo nao cabe.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.48  # TESTE (anterior: 0.52)
        cost_scaling_factor: 4.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true
      width: 4
      height: 4
      # 2,5 cm (antes 5 cm): o controlador confere colisao neste costmap.
      # Com 5 cm o arredondamento "aproximava" as paredes do corredor em ate
      # ~5 cm de cada lado e consumia a folga em corredores de ~80 cm.
      resolution: 0.025

      # Medidas reais (58 x 60 cm) em volta do centro de giro, com 1 cm de
      # margem: frente 0.31 (o LiDAR passa 2 cm do chassi) + 0.01, tras
      # 0.29 + 0.01, laterais 0.3015 (rodas) + ~0.01. A margem ja esta aqui,
      # por isso footprint_padding = 0. Antes: quadrado de 0.64 + padding
      # padrao de 0.01 (0.66 x 0.66 m).
      footprint: "[[0.32, 0.31], [0.32, -0.31], [-0.30, -0.31], [-0.30, 0.31]]"
      footprint_padding: 0.0

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan_mark scan_clear

        scan_mark:
          topic: /scan_front
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.08
          obstacle_max_range: 5.5
          obstacle_min_range: 0.08

        scan_clear:
          topic: /scan_front_clear
          max_obstacle_height: 2.0
          clearing: true
          marking: false
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.08

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Raio inscrito (0.32 m) + 0.20 m de folga, igual ao global.
        inflation_radius: 0.48  # TESTE (anterior: 0.52)
        cost_scaling_factor: 5.0


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
